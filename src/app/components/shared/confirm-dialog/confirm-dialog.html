@if (open) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
    <div class="w-full max-w-sm rounded-lg bg-white p-6 shadow-xl">
      <h3 class="mb-2 text-lg font-semibold text-gray-900">{{ title }}</h3>
      <p class="mb-6 text-sm text-gray-600">{{ message }}</p>
      <div class="flex justify-end gap-3">
        <button
          type="button"
          (click)="cancelled.emit()"
          class="cursor-pointer rounded-md px-4 py-2 text-sm text-gray-700 transition hover:bg-gray-100"
        >
          {{ cancelText }}
        </button>
        <button
          type="button"
          (click)="confirmed.emit()"
          class="cursor-pointer rounded-md bg-rose-500 px-4 py-2 text-sm text-white transition hover:bg-rose-600"
        >
          {{ confirmText }}
        </button>
      </div>
    </div>
  </div>
}
