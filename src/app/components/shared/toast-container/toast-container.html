<div class="pointer-events-none fixed right-4 top-4 z-50 flex w-full max-w-sm flex-col gap-2">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-start gap-3 rounded-lg border p-4 shadow-lg"
      [ngClass]="containerClass(toast.type)"
    >
      <i class="bi" [ngClass]="iconClass(toast.type)"></i>
      <p class="flex-1 text-sm">{{ toast.message }}</p>
      <button
        type="button"
        (click)="toastService.dismiss(toast.id)"
        aria-label="Dismiss notification"
        class="cursor-pointer text-current opacity-60 hover:opacity-100"
      >
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
  }
</div>
